<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Открытка для тебя</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient( circle at 30% 20%, rgba(255,255,255,.8), transparent 35% ), radial-gradient( circle at 70% 80%, rgba(255,180,190,.35), transparent 40% ), #f7e8e8;
        }


            /* Большие декоративные сердца */

            body::before,
            body::after {
                content: "♥";
                position: fixed;
                color: rgba(220, 80, 110, .12);
                font-size: 180px;
                pointer-events: none;
            }

            body::before {
                top: -50px;
                left: -40px;
                transform: rotate(-20deg);
            }

            body::after {
                bottom: -80px;
                right: -30px;
                transform: rotate(20deg);
            }


        /* =========================================
           КНИГА
        ========================================= */

        .book {
            width: 420px;
            height: 560px;
            position: relative;
            perspective: 2000px;
            filter: drop-shadow( 0 25px 30px rgba(70, 30, 40, .18) );
            animation: bookAppear 1.2s ease both;
        }


        /* =========================================
           ОБЩАЯ СТРАНИЦА
        ========================================= */

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient( 90deg, rgba(0,0,0,.025), transparent 8%, transparent 92%, rgba(0,0,0,.035) ), #fffdf8;
            border-radius: 6px 14px 14px 6px;
            transform-origin: left center;
            transition: transform 1.15s cubic-bezier(.65,.05,.36,1), box-shadow 1.15s ease;
            backface-visibility: hidden;
            box-shadow: inset 0 0 35px rgba(120,80,50,.05), 0 3px 8px rgba(0,0,0,.08);
            overflow: hidden;
        }


            /* Текстура бумаги */

            .page::before {
                content: "";
                position: absolute;
                inset: 0;
                opacity: .25;
                background-image: repeating-linear-gradient( 0deg, transparent, transparent 3px, rgba(120,90,70,.018) 4px );
                pointer-events: none;
            }


            /* Переплёт */

            .page::after {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 8px;
                background: linear-gradient( 90deg, rgba(80,40,40,.12), transparent );
                pointer-events: none;
            }


            /* Перелистывание */

            .page.flipped {
                transform: rotateY(-180deg);
            }


        /* =========================================
           ПЕРВАЯ СТРАНИЦА
        ========================================= */

        h1 {
            position: relative;
            z-index: 2;
            color: #8e3048;
            font-size: 38px;
            margin-bottom: 20px;
            animation: titleAppear .9s ease both;
        }


        p {
            position: relative;
            z-index: 2;
            max-width: 320px;
            color: #59454a;
            font-size: 19px;
            line-height: 1.7;
            animation: textAppear 1.1s ease .15s both;
        }


        /* Кнопка первой страницы */

        button {
            position: relative;
            z-index: 3;
            margin-top: 30px;
            padding: 13px 30px;
            border: none;
            border-radius: 50px;
            background: linear-gradient( 135deg, #d95772, #b93659 );
            color: white;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(185,54,89,.25);
            transition: transform .25s ease, box-shadow .25s ease;
        }


            button:hover {
                transform: translateY(-3px) scale(1.03);
                box-shadow: 0 12px 25px rgba(185,54,89,.35);
            }


            button:active {
                transform: scale(.96);
            }


        /* =========================================
           СЕРДЕЧКИ ПЕРВОЙ СТРАНИЦЫ
        ========================================= */

        .heart {
            position: absolute;
            color: #d95772;
            opacity: .7;
            animation: floatHeart 4s ease-in-out infinite;
            pointer-events: none;
        }


            .heart:nth-child(1) {
                top: 10%;
                left: 12%;
                font-size: 20px;
            }


            .heart:nth-child(2) {
                top: 18%;
                right: 13%;
                font-size: 14px;
                animation-delay: 1s;
            }


            .heart:nth-child(3) {
                bottom: 15%;
                left: 18%;
                font-size: 16px;
                animation-delay: 2s;
            }


            .heart:nth-child(4) {
                bottom: 10%;
                right: 15%;
                font-size: 22px;
                animation-delay: .5s;
            }


        /* =========================================
           СТРАНИЦЫ-КАРТИНКИ

           2 = page2.png
           3 = page3.png
           4 = page4.png
        ========================================= */

        .image-page {
            padding: 0 !important;
            display: block !important;
            background: #fff;
            cursor: pointer;
        }


            /* Убираем бумажную текстуру
           с картинок */

            .image-page::before {
                display: none;
            }


            .image-page::after {
                display: none;
            }


            /* Сама картинка */

            .image-page img {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                z-index: 1;
            }


        /* =========================================
           ПОСЛЕДНЯЯ СТРАНИЦА
        ========================================= */

        #p5 {
            cursor: pointer;
        }


        /* =========================================
           АНИМАЦИИ
        ========================================= */

        @keyframes titleAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes textAppear {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes floatHeart {

            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-12px) rotate(5deg);
            }
        }


        @keyframes bookAppear {

            from {
                opacity: 0;
                transform: scale(.92) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }


        /* =========================================
           ТЕЛЕФОН
        ========================================= */

        @media (max-width: 600px) {

            .book {
                width: 88vw;
                height: 120vw;
                max-height: 560px;
            }


            h1 {
                font-size: 30px;
            }


            p {
                font-size: 16px;
            }
        }
    </style>

</head>


<body>


    <div class="book">


        <!-- =========================================
             СТРАНИЦА 1
             ОСТАВЛЯЕМ КАК ЕСТЬ
        ========================================= -->

        <div class="page"
             id="p1"
             style="z-index:5">

            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>


            <h1>
                Для моей Булочки
            </h1>


            <div style="
                    position:relative;
                    z-index:2;
                    width:80px;
                    height:2px;
                    margin:5px 0 20px;
                    background:#d95772;
                    opacity:.5;
                "></div>


            <p>

                Нажми на кнопку,<br>

                чтобы открыть эту маленькую
                историю про нас.

            </p>


            <button onclick="flip(1)">

                Открыть

            </button>

        </div>



        <!-- =========================================
             СТРАНИЦА 2
             page2.png
        ========================================= -->

        <div class="page image-page"
             id="p2"
             style="z-index:4"
             onclick="flip(2)">

            <img src="page2.png"
                 alt="Страница 2">

        </div>



        <!-- =========================================
             СТРАНИЦА 3
             page3.png
        ========================================= -->

        <div class="page image-page"
             id="p3"
             style="z-index:3"
             onclick="flip(3)">

            <img src="page3.png"
                 alt="Страница 3">

        </div>



        <!-- =========================================
             СТРАНИЦА 4
             page4.png
        ========================================= -->

        <div class="page image-page"
             id="p4"
             style="z-index:2"
             onclick="flip(4)">

            <img src="page4.png"
                 alt="Страница 4">

        </div>



        <!-- =========================================
             СТРАНИЦА 5
             ПОСЛЕДНЯЯ
        ========================================= -->

        <div class="page"
             id="p5"
             style="z-index:1"
             onclick="restartCard()">

            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>


            <h1>
                ❤️ Спасибо ❤️
            </h1>


            <div style="
                    position:relative;
                    z-index:2;
                    width:80px;
                    height:2px;
                    margin:5px 0 20px;
                    background:#d95772;
                    opacity:.5;
                "></div>


            <p>

                Спасибо, что ты есть Солце, 
                очень-очень тебя люблю 💗

                <br><br>

                Эта открытка может начинаться
                снова и снова.

            </p>


            <p style="
                    margin-top:25px;
                    font-size:14px;
                    opacity:.5;
                ">

                Просто нажми в любом месте

            </p>

        </div>


    </div>



    <script>


        /* =========================================
        ПЕРЕЛИСТЫВАНИЕ
        ========================================= */

        let currentPage = 0;


        function flip(id) {

        const page =
        document.getElementById(
        "p" + id
        );


        page.classList.add(
        "flipped"
        );


        currentPage = id;
        }



        /* =========================================
        НАЧАТЬ ЗАНОВО
        ========================================= */

        function restartCard() {

        const pages =
        document.querySelectorAll(
        ".page"
        );


        /* Возвращаем страницы */

        pages.forEach(page => {

        page.classList.remove(
        "flipped"
        );

        });


        currentPage = 0;


        /* Перезапускаем анимацию */

        setTimeout(() => {

        pages.forEach(page => {

        page.style.animation =
        "none";


        void page.offsetWidth;


        page.style.animation =
        "";

        });

        }, 100);

        }


    </script>


</body>
</html>
